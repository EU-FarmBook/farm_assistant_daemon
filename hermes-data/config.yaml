_config_version: 42

providers:
  scaleway:
    base_url: https://api.scaleway.ai/b9c8497c-072a-47cf-b8a0-1878a92753fb/v1
    key_env: LLM_API_KEY
    extra_body:
      temperature: 0.6
      top_p: 0.95
      presence_penalty: 0
      chat_template_kwargs:
        enable_thinking: false

model:
  provider: custom:scaleway
  default: qwen3.5-397b-a17b

fallback_providers:
  - provider: custom:scaleway
    model: qwen3.5-397b-a17b

memory:
  memory_enabled: false
  user_profile_enabled: false

gateway:
  multiplex_profiles: true

platform_toolsets:
  api_server: []
  cli: []

code_execution:
  enabled: false

streaming:
  enabled: true

mcp_servers:
  eu-farmbook:
    command: python
    args:
      - /opt/data/scripts/mcp_eufarmbook.py
    env:
      EUF_ADAPTER_URL: http://adapter:8100
      EUF_BRIDGE_KEY_FILE: /opt/data/bridge.key
      EUF_PROFILE: "default"
    connect_timeout: 30.0
    enabled: true

session_reset:
  mode: none

max_tokens: 16384
